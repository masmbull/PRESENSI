#cloud-config
# =====================================================================
# PRESENSI — cloud-init user-data untuk EC2 Ubuntu 22.04 / 24.04 LTS
# Paste di EC2 console: Advanced Details → User data → As text
# Instance akan otomatis install + setup semua saat pertama jalan.
# =====================================================================
# Opsi (setel sebagai environment variable sebelum cloud-init jalan):
#   SEED_DUMMY=1          -> seed data dummy kota/toko/karyawan + foto tes
#   FACEID_API_KEY=<key>  -> kunci API (jika tidak di-set, akan generate random)
#   SKIP_NGINX=1          -> skip setup Nginx (mis. kalau mau setup manual)
#   SKIP_ENGINE=1         -> skip setup systemd engine (mis. mau setup manual)
# =====================================================================

package_update: true
package_upgrade: false

packages:
  - nginx
  - php8.4-fpm
  - php8.4-cli
  - php8.4-mbstring
  - php8.4-xml
  - php8.4-curl
  - php8.4-sqlite3
  - php8.4-gd
  - php8.4-zip
  - php8.4-bcmath
  - php8.4-intl
  - composer
  - python3.12
  - python3.12-venv
  - python3-pip
  - git
  - unzip
  - ca-certificates
  - curl
  - sqlite3


write_files:
  - path: /tmp/setup-presensi.sh
    permissions: '0755' 
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      REPO_URL="https://github.com/masmbull/PRESENSI.git"
      APP_DIR="/var/www/presensi"
      DOMAIN="attendance.example.com"
      SEED_DUMMY="${SEED_DUMMY:-0}"
      FACEID_API_KEY="${FACEID_API_KEY:-}"
      SKIP_NGINX="${SKIP_NGINX:-0}"
      SKIP_ENGINE="${SKIP_ENGINE:-0}"
      PHP_VERSION="8.3"
      PHP_FPM_SOCK="/run/php/php${PHP_VERSION}-fpm.sock"
      PHP_INI="/etc/php/${PHP_VERSION}/fpm/php.ini"
      echo "============================================"
      echo "  PRESENSI — Auto Setup (cloud-init)"
      echo "============================================"
