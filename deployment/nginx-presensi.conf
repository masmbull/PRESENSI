# PRESENSI — attendance.example.com
# TLS edge di-terminate Cloudflare; origin pakai Cloudflare Origin Certificate
# di /etc/nginx/ssl/origin.pem + origin.key. Selama sertifikat asli belum
# dipasang, setup-server.sh bikin self-signed sementara (30 hari) di path sama.
# Catatan: port 80 sengaja gak di-redirect — Always Use HTTPS ditangani Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name attendance.example.com;

    root /var/www/presensi/attendance-backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.example.com;

    root /var/www/presensi/attendance-backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}